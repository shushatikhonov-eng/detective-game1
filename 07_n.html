<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дело №07-N: Тень «Чёрного Хронометра»</title>
  <style>
    /* =====================================================================
       КЛАССИЧЕСКИЙ НУАРНЫЙ CSS (СТРОГО БЕЗ GRID, FLEXBOX GAP И ПЕРЕМЕННЫХ)
       Оптимизировано под Samsung Smart TV (1280x720 / зум 125%) без скролла
       ===================================================================== */
    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0e1218;
      color: #eae3d2;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.35;
      overflow-x: hidden;
    }
    button {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    /* Контейнер экрана ТВ */
    .tv-shell {
      width: 98%;
      max-width: 1160px;
      margin: 6px auto 4px auto;
    }

    /* ТОНКАЯ ВЕРХНЯЯ ПАНЕЛЬ (~42px) */
    .top-bar {
      display: table;
      width: 100%;
      height: 42px;
      background-color: #171e29;
      border: 1px solid #2c3749;
      border-bottom: 2px solid #e2a84b;
      border-radius: 6px;
      padding: 4px 10px;
      margin-bottom: 6px;
    }
    .top-cell-brand {
      display: table-cell;
      vertical-align: middle;
      width: 24%;
      white-space: nowrap;
    }
    .brand-sub {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 9px;
      color: #e2a84b;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: bold;
      color: #eae3d2;
      letter-spacing: 0.8px;
    }
    .top-cell-nav {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      width: 48%;
      white-space: nowrap;
    }
    .top-cell-stats {
      display: table-cell;
      vertical-align: middle;
      text-align: right;
      width: 28%;
      white-space: nowrap;
    }

    /* Кнопки навигации */
    .tab-btn {
      display: inline-block;
      background-color: #11161f;
      color: #cbd5e1;
      border: 1px solid #2c3749;
      border-radius: 4px;
      padding: 5px 10px;
      margin: 0 2px;
      font-size: 13px;
      font-weight: bold;
    }
    .tab-btn:hover, .tab-btn:focus {
      background-color: #222c3c;
      color: #ffffff;
      outline: 2px solid #e2a84b;
    }
    .tab-btn-active {
      background-color: #e2a84b;
      color: #0e1218;
      border-color: #e2a84b;
    }
    .tab-btn-active:hover, .tab-btn-active:focus {
      background-color: #f0bc68;
      color: #0e1218;
    }

    /* Счётчики и кнопка сброса */
    .stat-pill {
      display: inline-block;
      background-color: #0e1218;
      border: 1px solid #2c3749;
      border-radius: 4px;
      padding: 4px 7px;
      margin-left: 4px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      color: #e2a84b;
      vertical-align: middle;
    }
    .stat-pill-ok {
      border-color: #4ca375;
      color: #6ee7b7;
    }
    .stat-pill-warn {
      border-color: #c44d4d;
      color: #f87171;
    }
    .reset-btn {
      display: inline-block;
      background-color: #1e2736;
      color: #eae3d2;
      border: 1px solid #3c4a61;
      border-radius: 4px;
      padding: 4px 8px;
      margin-left: 5px;
      font-size: 12px;
      font-weight: bold;
      vertical-align: middle;
    }
    .reset-btn:hover, .reset-btn:focus {
      background-color: #c44d4d;
      border-color: #c44d4d;
      color: #ffffff;
      outline: 2px solid #e2a84b;
    }

    /* ОСНОВНАЯ НУАРНАЯ ПАНЕЛЬ */
    .noir-stage {
      background-color: #171e29;
      border: 1px solid #2c3749;
      border-radius: 8px;
      padding: 10px 14px;
    }
    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: bold;
      color: #eae3d2;
      margin: 0 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #2c3749;
    }
    h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: bold;
      color: #e2a84b;
      margin: 0 0 5px 0;
    }
    p {
      margin: 0 0 6px 0;
      font-size: 13px;
      line-height: 1.38;
      color: #dcd5c5;
    }

    /* Табличные колонки */
    .cols {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    .col {
      display: table-cell;
      vertical-align: top;
    }
    .w44 { width: 44%; padding-right: 12px; }
    .w56 { width: 56%; }
    .w58 { width: 58%; padding-right: 12px; }
    .w42 { width: 42%; }
    .w55 { width: 55%; padding-right: 12px; }
    .w45 { width: 45%; }
    .w48 { width: 48%; padding-right: 10px; }
    .w52 { width: 52%; }
    .w33 { width: 33.33%; padding: 0 5px; }

    /* Информационные блоки */
    .badge {
      display: inline-block;
      background-color: #0e1218;
      border: 1px solid #e2a84b;
      color: #e2a84b;
      font-family: "Courier New", Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 5px;
      letter-spacing: 0.6px;
    }
    .badge-red {
      border-color: #c44d4d;
      color: #e57373;
    }
    .badge-green {
      border-color: #4ca375;
      color: #6ee7b7;
    }

    .card-dark {
      background-color: #11161f;
      border: 1px solid #2c3749;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .card-amber {
      background-color: #1d1a14;
      border: 1px solid #8c672b;
      border-left: 3px solid #e2a84b;
      border-radius: 5px;
      padding: 7px 10px;
      margin-bottom: 6px;
    }
    .card-solved {
      background-color: #11211b;
      border: 1px solid #4ca375;
      border-left: 3px solid #4ca375;
      border-radius: 5px;
      padding: 8px 10px;
      margin-bottom: 6px;
      color: #d1fae5;
    }
    .card-red {
      background-color: #211316;
      border: 1px solid #c44d4d;
      border-left: 3px solid #c44d4d;
      border-radius: 5px;
      padding: 7px 10px;
      margin-bottom: 6px;
    }

    /* Кнопки действий */
    .btn {
      display: inline-block;
      background-color: #e2a84b;
      color: #0e1218;
      border: 1px solid #e2a84b;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      margin: 2px 4px 2px 0;
    }
    .btn:hover, .btn:focus {
      background-color: #f3c16e;
      outline: 2px solid #ffffff;
    }
    .btn-steel {
      background-color: #202a3a;
      color: #eae3d2;
      border: 1px solid #3c4c66;
    }
    .btn-steel:hover, .btn-steel:focus {
      background-color: #2c3a50;
      color: #ffffff;
      outline: 2px solid #e2a84b;
    }
    .btn-green {
      background-color: #245c42;
      color: #ecfdf5;
      border: 1px solid #4ca375;
    }
    .btn-green:hover, .btn-green:focus {
      background-color: #2e7554;
      outline: 2px solid #e2a84b;
    }
    .btn-burgundy {
      background-color: #6b2429;
      color: #fee2e2;
      border: 1px solid #c44d4d;
    }
    .btn-burgundy:hover, .btn-burgundy:focus {
      background-color: #8a2e35;
      outline: 2px solid #e2a84b;
    }
    .btn-block {
      display: block;
      width: 100%;
      text-align: center;
      margin: 4px 0;
    }
    .btn-left {
      text-align: left;
    }
    .btn-disabled {
      background-color: #131822;
      color: #64748b;
      border: 1px solid #232c3b;
      cursor: not-allowed;
    }
    .btn-disabled:hover, .btn-disabled:focus {
      background-color: #131822;
      outline: none;
    }

    /* Чипы улик */
    .chip {
      display: inline-block;
      background-color: #132920;
      color: #86efac;
      border: 1px solid #357554;
      border-radius: 3px;
      padding: 2px 6px;
      margin: 2px 3px 2px 0;
      font-size: 11px;
      font-family: "Courier New", Courier, monospace;
    }

    /* Сетка 3x2 кнопок комнат под чертежом */
    .room-grid {
      display: table;
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 4px;
      margin-top: 5px;
    }
    .room-row { display: table-row; }
    .room-cell { display: table-cell; width: 33.33%; }
    .room-btn {
      display: block;
      width: 100%;
      background-color: #11161f;
      color: #dcd5c5;
      border: 1px solid #2c3749;
      border-radius: 4px;
      padding: 5px 4px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .room-btn:hover, .room-btn:focus {
      background-color: #202b3d;
      outline: 2px solid #e2a84b;
    }
    .room-btn-active {
      background-color: #e2a84b;
      color: #0e1218;
      border-color: #e2a84b;
    }

    /* Карточки подозреваемых (4 в ряд) */
    .susp-strip {
      display: table;
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 6px 0;
      margin: 0 -6px 8px -6px;
    }
    .susp-cell { display: table-cell; width: 25%; vertical-align: top; }
    .susp-card {
      display: block;
      width: 100%;
      background-color: #11161f;
      color: #eae3d2;
      border: 1px solid #2c3749;
      border-radius: 6px;
      padding: 5px 6px;
      text-align: left;
    }
    .susp-card:hover, .susp-card:focus {
      background-color: #1e2736;
      outline: 2px solid #e2a84b;
    }
    .susp-card-active {
      background-color: #202938;
      border: 2px solid #e2a84b;
    }
    .susp-inner { display: table; width: 100%; }
    .susp-pic { display: table-cell; width: 54px; vertical-align: middle; }
    .susp-txt { display: table-cell; vertical-align: middle; padding-left: 8px; }
    .susp-name {
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: bold;
      color: #eae3d2;
      line-height: 1.2;
    }
    .susp-role {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.15;
    }

    /* Вкладки шифров (4 в ряд) */
    .puz-strip {
      display: table;
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 6px 0;
      margin: 0 -6px 8px -6px;
    }
    .puz-cell { display: table-cell; width: 25%; }
    .puz-btn {
      display: block;
      width: 100%;
      background-color: #11161f;
      color: #cbd5e1;
      border: 1px solid #2c3749;
      border-radius: 5px;
      padding: 6px 6px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }
    .puz-btn:hover, .puz-btn:focus {
      background-color: #202b3d;
      outline: 2px solid #e2a84b;
    }
    .puz-btn-active {
      background-color: #e2a84b;
      color: #0e1218;
      border-color: #e2a84b;
    }
    .puz-btn-solved {
      background-color: #132920;
      border-color: #4ca375;
      color: #86efac;
    }

    /* Матрица 5x5 и диск 16 букв */
    .cipher-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      font-family: "Courier New", Courier, monospace;
      background-color: #0e1218;
    }
    .cipher-table th, .cipher-table td {
      border: 1px solid #2c3749;
      text-align: center;
      padding: 3px 4px;
      font-size: 13px;
      font-weight: bold;
    }
    .cipher-table th {
      background-color: #1b2432;
      color: #e2a84b;
      font-size: 11px;
    }
    .cipher-table td {
      color: #eae3d2;
    }
    .wheel-grid {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      font-family: "Courier New", Courier, monospace;
      background-color: #0e1218;
    }
    .wheel-grid td {
      border: 1px solid #2c3749;
      text-align: center;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: bold;
      color: #eae3d2;
    }
    .wheel-num {
      color: #e2a84b;
      font-size: 10px;
      margin-right: 2px;
    }

    /* Экранная клавиатура */
    .kbd-box {
      background-color: #0e1218;
      border: 1px solid #2c3749;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .kbd-screen {
      background-color: #171e29;
      border: 2px solid #e2a84b;
      border-radius: 4px;
      padding: 5px 8px;
      margin-bottom: 7px;
      font-family: "Courier New", Courier, monospace;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 5px;
      color: #e2a84b;
      text-align: center;
    }
    .kbd-row {
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .kbd-key {
      display: inline-block;
      width: 38px;
      height: 28px;
      line-height: 26px;
      margin: 1px 2px;
      background-color: #1f2938;
      color: #eae3d2;
      border: 1px solid #3a4a63;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      vertical-align: middle;
    }
    .kbd-key-num {
      width: 64px;
      height: 36px;
      line-height: 34px;
      font-size: 17px;
      margin: 2px 3px;
    }
    .kbd-key:hover, .kbd-key:focus {
      background-color: #e2a84b;
      color: #0e1218;
      border-color: #ffffff;
      outline: 2px solid #ffffff;
    }
    .kbd-act {
      width: 96px;
      height: 30px;
      line-height: 28px;
      font-size: 12px;
      background-color: #263142;
    }
    .kbd-ok {
      width: 130px;
      height: 30px;
      line-height: 28px;
      font-size: 12px;
      background-color: #245c42;
      border-color: #4ca375;
      color: #ecfdf5;
    }
    .kbd-ok:hover, .kbd-ok:focus {
      background-color: #347d5a;
      color: #ffffff;
    }

    /* Модальное окно (вместо alert/confirm) */
    .modal-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(5, 8, 12, 0.85);
      z-index: 999;
      display: none;
    }
    .modal-box {
      width: 460px;
      max-width: 90%;
      margin: 110px auto 0 auto;
      background-color: #171e29;
      color: #eae3d2;
      border: 2px solid #e2a84b;
      border-radius: 8px;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div id="app" class="tv-shell"></div>

  <!-- Модальное окно -->
  <div id="modal-bg" class="modal-bg">
    <div class="modal-box">
      <h2 id="modal-title" style="border-color:#2c3749;">Уведомление</h2>
      <p id="modal-text" style="margin:10px 0 14px 0;font-size:14px;color:#eae3d2;"></p>
      <div style="text-align:right;">
        <button id="modal-cancel" class="btn btn-steel" style="display:none;">Отмена</button>
        <button id="modal-ok" class="btn">Понятно</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       СТРОГИЙ ES5 JAVASCRIPT ДЛЯ SAMSUNG SMART TV (TIZEN / ORSAY)
       Без const/let, стрелочных функций, шаблонных строк, includes, Object.assign
       ===================================================================== */

    // --- 1. НУАРНАЯ SVG-ГРАФИКА ---

    // 1.1 Ночной фасад клуба «Астория» под дождём с башенными часами

        '<rect x="56" y="88" width="348" height="10" fill="#1e293b" stroke="#2c3749" stroke-width="1.5"/>' +

        '<rect x="150" y="102" width="160" height="18" fill="#0b1019" stroke="#e2a84b" stroke-width="1.2"/>' +

        // Арочные окна (тёплый янтарь лампы)
        '<rect x="86" y="128" width="34" height="46" rx="14" fill="#e2a84b" opacity="0.9"/>' +
        '<line x1="103" y1="128" x2="103" y2="174" stroke="#151d2a" stroke-width="2"/>' +
        '<line x1="86" y1="152" x2="120" y2="152" stroke="#151d2a" stroke-width="2"/>' +

        '<rect x="138" y="128" width="34" height="46" rx="14" fill="#c78a32" opacity="0.75"/>' +
        '<line x1="155" y1="128" x2="155" y2="174" stroke="#151d2a" stroke-width="2"/>' +

        '<rect x="288" y="128" width="34" height="46" rx="14" fill="#c78a32" opacity="0.75"/>' +
        '<line x1="305" y1="128" x2="305" y2="174" stroke="#151d2a" stroke-width="2"/>' +

        '<rect x="340" y="128" width="34" height="46" rx="14" fill="#e2a84b" opacity="0.9"/>' +
        '<line x1="357" y1="128" x2="357" y2="174" stroke="#151d2a" stroke-width="2"/>' +
        '<line x1="340" y1="152" x2="374" y2="152" stroke="#151d2a" stroke-width="2"/>' +

        // Парадный вход и козырёк
        '<rect x="198" y="132" width="64" height="68" fill="#0d121a" stroke="#e2a84b" stroke-width="1.5"/>' +
        '<rect x="210" y="144" width="40" height="56" fill="#231c13"/>' +
        '<circle cx="230" cy="138" r="3" fill="#e2a84b"/>' +
        // Мокрая мостовая с отражением света
        '<rect x="0" y="200" width="460" height="15" fill="#090d14"/>' +
        '<ellipse cx="103" cy="207" rx="22" ry="3" fill="#e2a84b" opacity="0.28"/>' +

        '<ellipse cx="357" cy="207" rx="22" ry="3" fill="#e2a84b" opacity="0.28"/>' +
        // Диагональные линии нуарного дождя
        '<g stroke="#64748b" stroke-width="1" opacity="0.45">' +

      if (!reqFlags || reqFlags.length === 0) return true;
      for (var i = 0; i < reqFlags.length; i++) {

      }
      return false;

      if (hasItem(state.flags, 'puzzle4')) n++;

      document.getElementById('modal-text').innerHTML = text;

      var okBtn = document.getElementById('modal-ok');

      cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
      bg.style.display = 'block';

      okBtn.onclick = function() {
        bg.style.display = 'none';
        if (onOk) onOk();
      };
      cancelBtn.onclick = function() {

      };

                '<div class="susp-txt">' +
                  '<div class="susp-name">' + s.name + '</div>' +
                  '<div class="susp-role" style="color:' + s.accent + ';">' + s.role + '</div>' +
                '</div>' +
              '</div>' +
            '</button>' +
          '</div>';
      }
      strip += '</div>';

      var cur = SUSPECTS[state.selectedSuspect] || SUSPECTS.clara;
      var qHtml = '';
      var ansTitle = 'Первичное заявление:';
      var ansText = cur.base;

      for (var j = 0; j < cur.questions.length; j++) {
        var q = cur.questions[j];
        var unlocked = hasAnyFlag(q.reqFlags);
        var asked = hasItem(state.askedQuestions, q.id);

        if (state.activeQuestionId === q.id && asked) {
          ansTitle = q.label;
          ansText = q.answer;
        }

        if (!unlocked) {
          qHtml += '<button class="btn btn-block btn-left btn-disabled" disabled="disabled">🔒 ' + q.label +
            ' <span style="font-weight:normal;font-size:11px;color:#64748b;">(' + q.reqHint + ')</span></button>';
        } else {
          var bCls = asked ? 'btn btn-green btn-block btn-left' : 'btn btn-steel btn-block btn-left';
          qHtml += '<button class="' + bCls + '" data-action="ask-q" data-qid="' + q.id + '">' +
            (asked ? '✓ ' : '▸ ') + q.label + '</button>';
        }
      }

      return '' +
        strip +
        '<div class="cols">' +
          '<div class="col w48">' +
            '<h3>Допрос: ' + cur.name + '</h3>' +
            qHtml +
          '</div>' +
          '<div class="col w52">' +
            '<div class="card-dark" style="min-height:195px;border-left:3px solid ' + cur.accent + ';">' +
              '<span class="badge" style="border-color:' + cur.accent + ';color:' + cur.accent + ';">' + cur.role + '</span>' +
              '<div style="font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:bold;">' + ansTitle + '</div>' +
              '<div style="font-family:Georgia,serif;font-size:15px;line-height:1.45;color:#eae3d2;">' + ansText + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    // --- 8. ВКЛАДКА 4: ШИФРЫ (4 МНОГОШАГОВЫХ ГОЛОВОЛОМКИ + КЛАВИАТУРА) ---

    function renderKeyboard(isWord, cipherId) {
      var placeholder = isWord ? (cipherId === 'c1' ? '_ _ _ _ _ _' : '_ _ _ _ _') : '_ _ _ _';
      var html = '<div class="kbd-box">';
      html += '<div class="kbd-screen">' + (state.codeInput || placeholder) + '</div>';

      if (isWord) {
        var r1 = ['А','Б','В','Г','Д','Е','Ж','З','И'];
        var r2 = ['К','Л','М','Н','О','П','Р','С','Т'];
        var r3 = ['У','Ф','Х','Ц','Ч','Ш','Я'];
        html += '<div class="kbd-row">';
        for (var i = 0; i < r1.length; i++) html += '<button class="kbd-key" data-action="kbd-char" data-ch="' + r1[i] + '">' + r1[i] + '</button>';
        html += '</div><div class="kbd-row">';
        for (var j = 0; j < r2.length; j++) html += '<button class="kbd-key" data-action="kbd-char" data-ch="' + r2[j] + '">' + r2[j] + '</button>';
        html += '</div><div class="kbd-row">';
        for (var k = 0; k < r3.length; k++) html += '<button class="kbd-key" data-action="kbd-char" data-ch="' + r3[k] + '">' + r3[k] + '</button>';
        html += '</div>';
      } else {
        var n1 = ['1','2','3','4','5'];
        var n2 = ['6','7','8','9','0'];
        html += '<div class="kbd-row">';
        for (var a = 0; a < n1.length; a++) html += '<button class="kbd-key kbd-key-num" data-action="kbd-char" data-ch="' + n1[a] + '">' + n1[a] + '</button>';
        html += '</div><div class="kbd-row">';
        for (var b = 0; b < n2.length; b++) html += '<button class="kbd-key kbd-key-num" data-action="kbd-char" data-ch="' + n2[b] + '">' + n2[b] + '</button>';
        html += '</div>';
      }

      html += '<div class="kbd-row" style="margin-top:6px;margin-bottom:0;">';
      html += '<button class="kbd-key kbd-act" data-action="kbd-back">⌫ Стереть</button>';
      html += '<button class="kbd-key kbd-act" data-action="kbd-clear">Очистить</button>';
      html += '<button class="kbd-key kbd-ok" data-action="kbd-submit">ПРОВЕРИТЬ</button>';
      html += '</div>';

      if (state.codeMsg) {
        html += '<div style="margin-top:6px;font-size:12px;font-weight:bold;color:' + (state.codeMsgOk ? '#6ee7b7' : '#f87171') + ';">' + state.codeMsg + '</div>';
      }
      html += '</div>';
      return html;
    }

    function renderTabCiphers() {
      var cKeys = ['c1', 'c2', 'c3', 'c4'];
      var strip = '<div class="puz-strip">';
      for (var i = 0; i < cKeys.length; i++) {
        var ck = cKeys[i];
        var cp = CIPHERS[ck];
        var isSolved = hasItem(state.flags, cp.flag);
        var cls = 'puz-btn';
        if (state.selectedCipher === ck) cls += ' puz-btn-active';
        else if (isSolved) cls += ' puz-btn-solved';
        strip += '<div class="puz-cell"><button class="' + cls + '" data-action="select-cipher" data-cipher="' + ck + '">' +
          (isSolved ? '✓ ' : '🔒 ') + cp.shortName + '</button></div>';
      }
      strip += '</div>';

      var cur = CIPHERS[state.selectedCipher] || CIPHERS.c1;
      var solved = hasItem(state.flags, cur.flag);
      var hintOpen = hasItem(state.unlockedHints, cur.id);
      var leftHtml = '';

      if (cur.id === 'c1') {
        leftHtml = '' +
          '<table class="cipher-table">' +
            '<tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>' +
            '<tr><th>1</th><td>А</td><td>Б</td><td>В</td><td>Г</td><td>Д</td></tr>' +
            '<tr><th>2</th><td>Е</td><td>Ж</td><td>З</td><td>И</td><td>К</td></tr>' +
            '<tr><th>3</th><td>Л</td><td>М</td><td>Н</td><td>О</td><td>П</td></tr>' +
            '<tr><th>4</th><td>Р</td><td>С</td><td>Т</td><td>У</td><td>Ф</td></tr>' +
            '<tr><th>5</th><td>Х</td><td>Ц</td><td>Ч</td><td>Ш</td><td>Я</td></tr>' +

            '<strong style="color:#e2a84b;">Компас циферблата:</strong> 12:00 = вверх, 3:00 = вправо, 6:00 = вниз, 9:00 = влево. ' +
            '<strong>Старт:</strong> первая буква фамилии пострадавшего реставратора (Клайн). Каждый шаг — от предыдущей найденной буквы:<br/>' +
            '<span style="font-family:Courier New,monospace;color:#eae3d2;">' +
            '1) 6:00×1 &nbsp;|&nbsp; 2) 12:00×2, 9:00×(число подозреваемых)<br/>' +
            '3) 6:00×3, 3:00×2 &nbsp;|&nbsp; 4) 12:00×2, 9:00×2<br/>' +
            '5) 6:00×1, 3:00×2 &nbsp;|&nbsp; 6) 6:00×1' +
            '</span>' +
          '</div>';
      } else if (cur.id === 'c2') {
        leftHtml = '' +
          '<div class="card-dark" style="font-size:13px;line-height:1.45;">' +
            '<p>Четырёхзначный код реле <strong style="color:#e2a84b;font-family:Courier New,monospace;">A B C D</strong> состоит из четырёх <strong>РАЗНЫХ цифр от 1 до 9</strong>. Из журнала инженера известно:</p>' +
            '<p style="margin-bottom:4px;"><strong>1)</strong> Сумма всех четырёх цифр равна <strong>часу отключения света</strong> в клубе.</p>' +

            '<p style="margin-bottom:0;"><strong>4)</strong> Разность между четвёртой и первой цифрами равна 5 (<strong>D − A = 5</strong>).</p>' +
          '</div>';
      } else if (cur.id === 'c3') {
        leftHtml = '' +
          '<div class="card-dark" style="font-size:13px;line-height:1.42;">' +
            '<p>Определите номер комнаты каждого подозреваемого в <strong>21:40</strong> (за 20 мин до блэкаута) и введите 4 цифры в <strong>алфавитном порядке имён</strong>:<br/>' +
            '<strong style="color:#e2a84b;">Виктор — Клара — Леон — Марта</strong>.</p>' +
            '<p style="margin-bottom:4px;"><strong>1)</strong> Сработали датчики ровно в 4 комнатах: <strong>2</strong> (Архив), <strong>3</strong> (Холл), <strong>4</strong> (Бар) и <strong>6</strong> (Котельная) — по одному человеку в каждой.</p>' +
            '<p style="margin-bottom:4px;"><strong>2)</strong> Номер комнаты Виктора ровно вдвое больше номера комнаты Леона.</p>' +
            '<p style="margin-bottom:4px;"><strong>3)</strong> Сумма номеров комнат Клары и Марты равна номеру комнаты Виктора.</p>' +
            '<p style="margin-bottom:0;"><strong>4)</strong> Номер комнаты Клары больше номера комнаты Леона.</p>' +
          '</div>';
      } else if (cur.id === 'c4') {
        leftHtml = '' +
          '<table class="wheel-grid">' +
            '<tr>' +
              '<td><span class="wheel-num">1</span>А</td><td><span class="wheel-num">2</span>Б</td><td><span class="wheel-num">3</span>В</td><td><span class="wheel-num">4</span>Г</td>' +
              '<td><span class="wheel-num">5</span>Д</td><td><span class="wheel-num">6</span>Е</td><td><span class="wheel-num">7</span>И</td><td><span class="wheel-num">8</span>К</td>' +
            '</tr>' +
            '<tr>' +
              '<td><span class="wheel-num">9</span>Л</td><td><span class="wheel-num">10</span>М</td><td><span class="wheel-num">11</span>Н</td><td><span class="wheel-num">12</span>О</td>' +
              '<td><span class="wheel-num">13</span>П</td><td><span class="wheel-num">14</span>Р</td><td><span class="wheel-num">15</span>С</td><td><span class="wheel-num">16</span>Т</td>' +
            '</tr>' +
          '</table>' +
          '<div class="card-dark" style="font-size:13px;line-height:1.45;">' +
            '<p>На латунном диске шкатулки выбит шифр:<br/>' +
            '<strong style="font-family:Courier New,monospace;font-size:17px;color:#e2a84b;letter-spacing:4px;">Б — П — Н — М — В</strong></p>' +
            '<p style="margin-bottom:0;"><strong>Правило мастера:</strong> чтобы расшифровать каждую букву, сдвинь её <strong>НАЗАД по кругу (1→16)</strong> ровно на её порядковый номер в слове (1-ю букву назад на 1, 2-ю на 2, 3-ю на 3, 4-ю на 4, 5-ю на 5).</p>' +
          '</div>';
      }

      var rightHtml = '';
      if (solved) {
        rightHtml = '' +
          '<div class="card-solved" style="padding:12px;">' +
            '<span class="badge badge-green">ШИФР ВЗЛОМАН • ' + cur.answer + '</span>' +
            '<h3 style="color:#6ee7b7;margin-bottom:6px;">' + cur.secretTitle + '</h3>' +
            '<p style="color:#ecfdf5;font-size:13px;line-height:1.45;margin-bottom:10px;">' + cur.secretText + '</p>' +
            '<button class="btn btn-steel btn-block" data-action="set-tab" data-tab="suspects">Перейти к допросам подозреваемых →</button>' +
          '</div>';
      } else {
        rightHtml = renderKeyboard(cur.type === 'word', cur.id);
        if (hintOpen) {
          rightHtml += '<div class="card-amber" style="margin-top:6px;margin-bottom:0;font-size:12px;"><strong>Подсказка:</strong> ' + cur.hint + '</div>';
        } else {
          rightHtml += '<button class="btn btn-steel btn-block" style="margin-top:6px;" data-action="buy-hint" data-cipher="' + cur.id + '">💡 Открыть подсказку (−1 ход)</button>';
        }
      }

      return '' +
        strip +
        '<div class="cols">' +
          '<div class="col w55">' +
            '<h2>' + cur.title + '</h2>' +
            leftHtml +
          '</div>' +
          '<div class="col w45">' +
            rightHtml +
          '</div>' +
        '</div>';
    }

    // --- 9. ВКЛАДКА 5: ФИНАЛЬНЫЙ ВЕРДИКТ ---

    function renderTabVerdict() {
      if (state.endingKey) {
        var end = ENDINGS[state.endingKey];
        return '' +
          '<span class="badge">' + end.badge + '</span>' +
          '<h2>' + end.title + '</h2>' +
          '<div class="' + end.cls + '" style="font-size:14px;line-height:1.48;padding:12px;">' + end.text + '</div>' +
          '<div class="card-dark">' +
            '<strong>Итоги расследования:</strong> Верных выводов: <strong style="color:#e2a84b;">' + state.endingScore + ' из 3</strong> &nbsp;•&nbsp; ' +
            'Взломано шифров: <strong style="color:#6ee7b7;">' + countCiphers() + ' из 4</strong> &nbsp;•&nbsp; ' +
            'Осталось ходов: <strong>' + state.timeLeft + ' из 7</strong>.' +
          '</div>' +
          '<div class="cols" style="margin-top:8px;">' +
            '<div class="col" style="width:50%;padding-right:5px;"><button class="btn btn-steel btn-block" data-action="reopen-verdict">← Изменить ответы</button></div>' +
            '<div class="col" style="width:50%;padding-left:5px;"><button class="btn btn-block" data-action="reset-game">Начать дело заново</button></div>' +
          '</div>';
      }

      var optThief = [
        { id: 'clara', label: 'Клара Вейс' },
        { id: 'viktor', label: 'Виктор Соболь' },
        { id: 'marta', label: 'Марта Келлер' },
        { id: 'leon', label: 'Леон Грант' }
      ];
      var optBlackout = [
        { id: 'viktor_leon', label: 'Виктор Соболь и Леон Грант' },
        { id: 'clara', label: 'Клара Вейс' },
        { id: 'marta', label: 'Марта Келлер' },
        { id: 'storm', label: 'Случайная гроза' }
      ];
      var optHiding = [
        { id: 'boiler', label: 'В вентиляции Котельной' },
        { id: 'pendulum', label: 'В маятнике часов в Холле' },
        { id: 'clara_bag', label: 'В сумочке Клары' },
        { id: 'leon_case', label: 'В чемодане Леона' }
      ];

      function buildChoices(list, currentVal, actionName) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
          var o = list[i];
          var cls = (currentVal === o.id) ? 'btn btn-block btn-left' : 'btn btn-steel btn-block btn-left';
          html += '<button class="' + cls + '" data-action="' + actionName + '" data-val="' + o.id + '">' +
            (currentVal === o.id ? '● ' : '○ ') + o.label + '</button>';
        }
        return html;
      }

      var ready = state.vThief && state.vBlackout && state.vHiding;

      return '' +
        '<h2>Официальный вердикт по делу №07-N</h2>' +
        '<div class="cols" style="margin:0 -5px;">' +
          '<div class="col w33">' +
            '<div class="card-dark">' +
              '<h3>1. Кто усыпил Клайна и забрал Хронометр?</h3>' +
              buildChoices(optThief, state.vThief, 'v-thief') +
            '</div>' +
          '</div>' +
          '<div class="col w33">' +
            '<div class="card-dark">' +
              '<h3>2. Кто организовал блэкаут в 22:00?</h3>' +
              buildChoices(optBlackout, state.vBlackout, 'v-blackout') +
            '</div>' +
          '</div>' +
          '<div class="col w33">' +
            '<div class="card-dark">' +
              '<h3>3. Где спрятан настоящий Хронометр?</h3>' +
              buildChoices(optHiding, state.vHiding, 'v-hiding') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-block ' + (ready ? 'btn-green' : 'btn-disabled') + '" style="margin-top:8px;padding:9px;font-size:14px;" data-action="submit-verdict">' +
          '⚖ Вынести официальный вердикт' +
        '</button>';
    }

    // --- 10. ГЛАВНЫЙ РЕНДЕР ---

    function render() {
      var app = document.getElementById('app');
      var tabs = [
        { id: 'case', label: 'Дело' },
        { id: 'map', label: 'Карта' },
        { id: 'suspects', label: 'Допросы' },
        { id: 'ciphers', label: 'Шифры' },
        { id: 'verdict', label: 'Вердикт' }
      ];

      var navHtml = '';
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var cls = 'tab-btn' + (state.tab === t.id ? ' tab-btn-active' : '');
        navHtml += '<button class="' + cls + '" data-action="set-tab" data-tab="' + t.id + '">' + t.label + '</button>';
      }

      var solvedCount = countCiphers();
      var topBar = '' +
        '<div class="top-bar">' +
          '<div class="top-cell-brand">' +
            '<span class="brand-sub">ДЕЛО №07-N • КЛУБ «АСТОРИЯ»</span>' +
            '<span class="brand-title">ЧЁРНЫЙ ХРОНОМЕТР</span>' +
          '</div>' +
          '<div class="top-cell-nav">' + navHtml + '</div>' +
          '<div class="top-cell-stats">' +
            '<span class="stat-pill' + (solvedCount === 4 ? ' stat-pill-ok' : '') + '">Шифры: ' + solvedCount + '/4</span>' +
            '<span class="stat-pill' + (state.timeLeft <= 1 ? ' stat-pill-warn' : '') + '">Ходы: ' + state.timeLeft + '/7</span>' +
            '<button class="reset-btn" data-action="reset-game">Сброс</button>' +
          '</div>' +
        '</div>';

      var stageBody = '';
      if (state.tab === 'case') stageBody = renderTabCase();
      else if (state.tab === 'map') stageBody = renderTabMap();
      else if (state.tab === 'suspects') stageBody = renderTabSuspects();
      else if (state.tab === 'ciphers') stageBody = renderTabCiphers();
      else if (state.tab === 'verdict') stageBody = renderTabVerdict();

      app.innerHTML = topBar + '<div class="noir-stage">' + stageBody + '</div>';
    }

    // --- 11. ОБРАБОТКА СОБЫТИЙ (ES5) ---

    function findActionNode(el) {
      while (el && el !== document) {
        if (el.getAttribute && el.getAttribute('data-action')) return el;
        el = el.parentNode;
      }
      return null;
    }

    function checkCipherInput() {
      var cur = CIPHERS[state.selectedCipher];
      if (!cur) return;
      var val = state.codeInput.replace(/^\s+|\s+$/g, '').toUpperCase();
      if (!val) return;
      if (val === cur.answer) {
        addItem(state.flags, cur.flag);
        state.codeInput = '';
        state.codeMsg = '✓ ШИФР ВЗЛОМАН! Улика добавлена в дело.';
        state.codeMsgOk = true;
      } else {
        state.codeMsg = '✗ НЕВЕРНЫЙ ОТВЕТ (' + val + '). Перепроверьте расчёты.';
        state.codeMsgOk = false;
      }
      render();
    }

    function evaluateVerdict() {
      if (!state.vThief || !state.vBlackout || !state.vHiding) return;
      var score = 0;
      if (state.vThief === 'marta') score++;
      if (state.vBlackout === 'viktor_leon') score++;
      if (state.vHiding === 'pendulum') score++;
      state.endingScore = score;
      state.endingKey = 'e' + score;
      render();
    }

    function doReset() {
      state.tab = 'case';
      state.selectedRoom = 'gallery';
      state.selectedSuspect = 'clara';
      state.activeQuestionId = null;
      state.selectedCipher = 'c1';
      state.timeLeft = 7;
      state.flags = [];
      state.askedQuestions = [];
      state.unlockedHints = [];
      state.codeInput = '';
      state.codeMsg = '';
      state.codeMsgOk = false;
      state.vThief = '';
      state.vBlackout = '';
      state.vHiding = '';
      state.endingKey = null;
      state.endingScore = 0;
      render();
    }

    document.onclick = function(e) {
      e = e || window.event;
      var node = findActionNode(e.target || e.srcElement);
      if (!node) return;
      var act = node.getAttribute('data-action');

      if (act === 'set-tab') {
        state.tab = node.getAttribute('data-tab');
        render();
      } else if (act === 'select-room') {
        state.selectedRoom = node.getAttribute('data-room');
        render();
      } else if (act === 'inspect-room') {
        var rm = ROOMS[state.selectedRoom];
        if (rm && !hasItem(state.flags, rm.flag)) {
          if (spendTurn()) {
            addItem(state.flags, rm.flag);
            render();
          }
        }
      } else if (act === 'map-jump') {
        var jTab = node.getAttribute('data-tab');
        var jTarget = node.getAttribute('data-target');
        state.tab = jTab;
        if (jTab === 'ciphers') {
          state.selectedCipher = jTarget;
          state.codeInput = '';
          state.codeMsg = '';
        } else if (jTab === 'suspects') {
          state.selectedSuspect = jTarget;
          state.activeQuestionId = null;
        }
        render();
      } else if (act === 'select-suspect') {
        state.selectedSuspect = node.getAttribute('data-suspect');
        state.activeQuestionId = null;
        render();
      } else if (act === 'ask-q') {
        var qid = node.getAttribute('data-qid');
        var sp = SUSPECTS[state.selectedSuspect];
        if (!sp) return;
        for (var i = 0; i < sp.questions.length; i++) {
          var q = sp.questions[i];
          if (q.id === qid) {
            if (!hasAnyFlag(q.reqFlags)) return;
            if (!hasItem(state.askedQuestions, q.id)) {
              if (q.cost > 0 && !spendTurn()) return;
              addItem(state.askedQuestions, q.id);
              if (q.unlockFlag) addItem(state.flags, q.unlockFlag);
            }
            state.activeQuestionId = q.id;
            render();
            break;
          }
        }
      } else if (act === 'select-cipher') {
        state.selectedCipher = node.getAttribute('data-cipher');
        state.codeInput = '';
        state.codeMsg = '';
        render();
      } else if (act === 'buy-hint') {
        var cid = node.getAttribute('data-cipher');
        if (!hasItem(state.unlockedHints, cid)) {
          if (spendTurn()) {
            addItem(state.unlockedHints, cid);
            render();
          }
        }
      } else if (act === 'kbd-char') {
        if (state.codeInput.length < 8) {
          state.codeInput += node.getAttribute('data-ch');
          state.codeMsg = '';
          render();
        }
      } else if (act === 'kbd-back') {
        if (state.codeInput.length > 0) {
          state.codeInput = state.codeInput.substring(0, state.codeInput.length - 1);
          render();
        }
      } else if (act === 'kbd-clear') {
        state.codeInput = '';
        state.codeMsg = '';
        render();
      } else if (act === 'kbd-submit') {
        checkCipherInput();
      } else if (act === 'v-thief') {
        state.vThief = node.getAttribute('data-val');
        render();
      } else if (act === 'v-blackout') {
        state.vBlackout = node.getAttribute('data-val');
        render();
      } else if (act === 'v-hiding') {
        state.vHiding = node.getAttribute('data-val');
        render();
      } else if (act === 'submit-verdict') {
        evaluateVerdict();
      } else if (act === 'reopen-verdict') {
        state.endingKey = null;
        render();
      } else if (act === 'reset-game') {
        showModal('Начать расследование заново?', 'Все открытые улики, шифры, подсказки и ходы будут сброшены.', doReset, true);
      }
    };

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
